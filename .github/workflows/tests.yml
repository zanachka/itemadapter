name: Tests

on:
  push:
    branches:
    - master
    - '[0-9]+.[0-9]+'
  pull_request:

permissions: {}

jobs:
  tests-ubuntu:
    name: "Test: ${{ matrix.python-version }}, Ubuntu"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC authentication with Codecov
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: "3.10"
          env:
            TOXENV: min-attrs
        - python-version: "3.10"
          env:
            TOXENV: min-pydantic
        - python-version: "3.10"
          env:
            TOXENV: min-scrapy
        - python-version: "3.10"
          env:
            TOXENV: min-extra
        - python-version: "3.10"
          env:
            TOXENV: py
        - python-version: "3.11"
          env:
            TOXENV: py
        - python-version: "3.12"
          env:
            TOXENV: py
        - python-version: "3.13"
          env:
            TOXENV: py
        - python-version: "3.14"
          env:
            TOXENV: py
        - python-version: "3.14"
          env:
            TOXENV: attrs
        - python-version: "3.14"
          env:
            TOXENV: pydantic
        - python-version: "3.14"
          env:
            TOXENV: scrapy
        - python-version: "3.14"
          env:
            TOXENV: extra
        - python-version: "pypy3.11"
          env:
            TOXENV: py

        # pydantic1 won't support 3.14
        - python-version: "3.13"
          env:
            TOXENV: pydantic1
        - python-version: "3.13"
          env:
            TOXENV: extra-pydantic1


    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install tox
      run: pip install tox

    - name: Run tests
      env: ${{ matrix.env }}
      run: tox

    - name: Upload coverage report
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5

  tests-other-os:
    name: "Test: py310, ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    permissions:
      contents: read
      id-token: write  # OIDC authentication with Codecov
    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.10"

    - name: Install tox
      run: pip install tox

    - name: Run tests
      run: tox -e py

    - name: Upload coverage report
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
